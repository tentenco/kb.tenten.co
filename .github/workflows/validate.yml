name: Validate knowledge base
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/build.py
      - run: python3 scripts/harness.py
      - run: node --check web/app.js
      - run: node --check web/theme-init.js
      - run: git diff --exit-code -- site exports
